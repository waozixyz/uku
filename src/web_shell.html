<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="web-assets/uku-logo.svg" type="image/svg+xml">
  <title>Ukuvota</title>
  <style>
    :root {
      --app-background: #f8f5ef;
      --ink: #25342f;
      --accent: #d94f3d;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--app-background);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      width: 100%;
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--app-background);
    }

    .canvas-frame {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    canvas.emscripten {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      border: 0;
      outline: 0;
      background: var(--app-background);
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: var(--app-background);
      opacity: 1;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    .loading-screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-panel {
      width: min(340px, 100%);
      display: grid;
      justify-items: center;
      gap: 16px;
      text-align: center;
    }

    .loading-mark {
      width: 76px;
      height: 76px;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(37, 52, 47, 0.18);
    }

    .loading-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 700;
    }

    #status {
      min-height: 1.35em;
      color: rgba(37, 52, 47, 0.78);
      font-size: 13px;
      line-height: 1.35;
    }

    #progress {
      width: min(280px, 100%);
      height: 8px;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      background: rgba(37, 52, 47, 0.16);
    }

    #progress::-webkit-progress-bar {
      border-radius: 999px;
      background: rgba(37, 52, 47, 0.16);
    }

    #progress::-webkit-progress-value {
      border-radius: 999px;
      background: var(--accent);
    }

    #progress::-moz-progress-bar {
      border-radius: 999px;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loading-screen" role="status" aria-live="polite">
    <div class="loading-panel">
      <img class="loading-mark" src="web-assets/uku-logo.svg" alt="" width="76" height="76">
      <h1 class="loading-title">Ukuvota</h1>
      <div id="status">Downloading...</div>
      <progress value="0" max="100" id="progress" hidden></progress>
    </div>
  </div>
  <div class="stage">
    <div class="canvas-frame" id="canvas-frame">
      <canvas class="emscripten" id="canvas" width="320" height="560" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>
  </div>
  <script>
    var canvas = document.getElementById("canvas");
    var statusElement = document.getElementById("status");
    var progressElement = document.getElementById("progress");
    var loadingScreen = document.getElementById("loading-screen");

    function hideLoadingScreen() {
      if(!loadingScreen) return;
      window.requestAnimationFrame(function() {
        loadingScreen.classList.add("is-hidden");
      });
    }

    var Module = {
      canvas: canvas,
      postRun: [hideLoadingScreen],
      setStatus: function(text) {
        if(!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: "" };
        if(text === Module.setStatus.last.text) return;

        var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if(match && now - Module.setStatus.last.time < 30) return;

        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;

        if(match) {
          statusElement.textContent = match[1];
          progressElement.value = parseInt(match[2], 10) * 100;
          progressElement.max = parseInt(match[4], 10) * 100;
          progressElement.hidden = false;
        } else {
          statusElement.textContent = text || "";
          progressElement.hidden = true;
          if(!text) hideLoadingScreen();
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? "Preparing... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "All downloads complete.");
      },
      locateFile: function(path, prefix) {
        if(path === "index.data") {
          return prefix + path;
        }
        return prefix + path;
      },
    };
    globalThis.Module = Module;
    Module.setStatus("Downloading...");

    (function() {
      if((location.hostname !== "localhost" && location.hostname !== "127.0.0.1") ||
         location.port !== "8080") {
        return;
      }

      var seenVersion = null;

      function pollReload() {
        fetch("/__uku_reload", { cache: "no-store" })
          .then(function(response) { return response.ok ? response.json() : null; })
          .then(function(state) {
            if(!state) return;
            if(seenVersion === null) {
              seenVersion = state.version;
            } else if(state.ok && state.version !== seenVersion) {
              window.location.reload();
            }
          })
          .catch(function() {});
      }

      setInterval(pollReload, 1000);
      pollReload();
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ukuvota</title>
  <link rel="icon" href="uku-logo.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; background: #f5f5f5; }
    canvas { display: block; width: 100%; height: calc(100dvh - 54px); }
    #status { position: fixed; top: 0; padding: 12px; background: white; font: 14px system-ui; }
    #status:empty { display: none; }
    #tools { position: fixed; bottom: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 0 12px; background: #f5f5f5; box-sizing: border-box; }
    #tools button { padding: 10px; }
    #fields { position: fixed; left: 0; right: 0; overflow: hidden; pointer-events: none; }
    #fields input { position: absolute; box-sizing: border-box; padding: 0 8px; margin: 0; border: 0; outline: 0; background: transparent; color: transparent; caret-color: transparent; font: 16px sans-serif; pointer-events: auto; }
    #fields input::selection { background: transparent; }
    #fields input::placeholder { color: transparent; }
  </style>
</head>
<body>
  <p id="status" role="status">Loading Ukuvota…</p>
  <canvas id="canvas" tabindex="0" aria-label="Ukuvota decision workspace"></canvas>
  <div id="fields"></div>
  <div id="tools">
    <button id="retry" hidden>Retry saving</button>
    <button id="backup" hidden>Download backup</button>
  </div>
  <script src="browser-input.js"></script>
  <script>
    var fields = new InputFields(document.getElementById('fields'));
    var Module = {
      canvas: document.getElementById('canvas'),
      ukuSaveFailed: false,
      beginFields: function (top, height, backupLabel, retryLabel) {
        fields.begin(top, height);
        var backup = document.getElementById('backup');
        var retry = document.getElementById('retry');
        if (backup.textContent !== backupLabel) backup.textContent = backupLabel;
        if (retry.textContent !== retryLabel) retry.textContent = retryLabel;
      },
      inputField: function (...args) { return fields.field(...args); },
      endFields: function () { fields.end(); },
      saveUkuData: function () {
        Module.ukuSaveQueued = true;
        if (Module.ukuSaving) return;
        function save() {
          Module.ukuSaveQueued = false;
          Module.ukuSaving = true;
          var completed = false;
          function saved(error) {
            if (completed) return;
            completed = true;
            Module.ukuSaveFailed = Boolean(error);
            document.getElementById('retry').hidden = !error;
            Module.ukuSaving = false;
            if (Module.ukuSaveQueued && !error) save();
          }
          try { FS.syncfs(false, saved); } catch (error) { saved(error); }
        }
        save();
      },
      preRun: [function () {
        FS.mkdir('/data');
        FS.mount(IDBFS, {}, '/data');
        addRunDependency('uku-data');
        function restored(error) {
          if (error) {
            Module.ukuStartupFailed = true;
            document.getElementById('status').textContent = 'Could not open saved data. Enable browser storage and reload.';
            return;
          }
          removeRunDependency('uku-data');
        }
        try { FS.syncfs(true, restored); } catch (error) { restored(error); }
      }],
      setStatus: function (text) {
        if (!Module.ukuStartupFailed) document.getElementById('status').textContent = text;
      },
      onRuntimeInitialized: function () {
        document.getElementById('status').textContent = '';
        Module.canvas.focus();
        document.getElementById('backup').hidden = false;
      },
      onAbort: function () {
        document.getElementById('status').textContent = 'Ukuvota could not start. Reload to try again.';
      }
    };
    document.getElementById('retry').addEventListener('click', function () {
      Module.saveUkuData();
    });
    document.getElementById('backup').addEventListener('click', function () {
      try {
        var bytes = FS.readFile('/data/uku.sqlite3');
        var url = URL.createObjectURL(new Blob([bytes], {type: 'application/vnd.sqlite3'}));
        var link = document.createElement('a');
        link.href = url;
        link.download = 'ukuvota-backup.sqlite3';
        link.click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      } catch (error) {
        document.getElementById('status').textContent = 'Could not download the backup. Keep this page open and try again.';
      }
    });
    window.addEventListener('beforeunload', function (event) {
      if (Module.ukuSaving || Module.ukuSaveFailed) {
        event.preventDefault();
        event.returnValue = '';
      }
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>

name: Netlify

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Packages
        timeout-minutes: 15
        run: .github/scripts/install-apt-packages.sh .github/apt/web-packages.txt

      - name: Set Up Emscripten
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$HOME/emsdk/.emscripten" >> "$GITHUB_ENV"
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Build Site
        run: |
          set -euo pipefail
          make web
          test -f build/dist/web/index.html
          test -f build/dist/web/index.js
          test -f build/dist/web/index.wasm

      - name: Upload Site Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uku-site
          path: build/dist/web
          if-no-files-found: error

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Download Site Artifact
        uses: actions/download-artifact@v4
        with:
          name: uku-site
          path: site

      - name: Install Netlify CLI
        run: npm install --global netlify-cli

      - name: Deploy Preview To Netlify
        run: |
          set -euo pipefail
          auth_token="$(printf '%s' "$NETLIFY_AUTH_TOKEN" | tr -d '\r\n')"
          site_id="$(printf '%s' "$NETLIFY_SITE_ID" | tr -d '\r\n')"
          netlify deploy \
            --dir site \
            --no-build \
            --alias "pr-${{ github.event.pull_request.number }}" \
            --message "Preview ${{ github.event.pull_request.number }}" \
            --auth "$auth_token" \
            --site "$site_id"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'

    steps:
      - name: Download Site Artifact
        uses: actions/download-artifact@v4
        with:
          name: uku-site
          path: site

      - name: Package Site
        run: |
          set -euo pipefail
          test -f site/index.html
          zip_root="$PWD/uku-site.zip"
          cd site
          python3 -m zipfile -c "$zip_root" .
          test -s "$zip_root"
          echo "ZIP_PATH=$zip_root" >> "$GITHUB_ENV"

      - name: Deploy Production To Netlify
        run: |
          set -euo pipefail
          auth_token="$(printf '%s' "$NETLIFY_AUTH_TOKEN" | tr -d '\r\n')"
          site_id="$(printf '%s' "$NETLIFY_SITE_ID" | tr -d '\r\n')"
          test -n "$auth_token" || { echo "::error::NETLIFY_AUTH_TOKEN is empty or missing"; exit 1; }
          test -n "$site_id" || { echo "::error::NETLIFY_SITE_ID is empty or missing"; exit 1; }

          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $auth_token" \
            -H "Content-Type: application/zip" \
            --data-binary "@$ZIP_PATH" \
            "https://api.netlify.com/api/v1/sites/$site_id/deploys?production=true")"

          python3 - "$response" "$auth_token" <<'PY'
          import json
          import sys
          import time
          import urllib.request

          deploy = json.loads(sys.argv[1])
          token = sys.argv[2]
          deploy_id = deploy.get("id", "")
          if not deploy_id:
              print("Netlify deploy response did not include an id", file=sys.stderr)
              raise SystemExit(1)

          headers = {"Authorization": f"Bearer {token}"}
          for _ in range(90):
              state = deploy.get("state", "")
              url = deploy.get("ssl_url") or deploy.get("url") or deploy.get("deploy_ssl_url") or deploy.get("deploy_url") or deploy_id
              print(f"Netlify deploy {state}: {url}")
              if state == "ready":
                  raise SystemExit(0)
              if state in ("error", "failed", "rejected"):
                  raise SystemExit(1)
              request = urllib.request.Request(f"https://api.netlify.com/api/v1/deploys/{deploy_id}", headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  deploy = json.loads(response.read().decode("utf-8"))
              time.sleep(2)

          print("Netlify deploy did not become ready within 180 seconds", file=sys.stderr)
          raise SystemExit(1)
          PY
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APT_CACHE_DIR: /tmp/apt-cache
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Test apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: test-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt/test-packages.txt') }}
          restore-keys: |
            test-apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Test Dependencies
        timeout-minutes: 15
        run: .github/scripts/install-apt-packages.sh .github/apt/test-packages.txt

      - name: Set up locked Ziran
        uses: ./.github/actions/ziran

      - name: Run Tests
        run: make test

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    env:
      APT_CACHE_DIR: /tmp/apt-cache
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Web apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: web-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt/web-packages.txt') }}
          restore-keys: |
            web-apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Web Dependencies
        timeout-minutes: 15
        run: .github/scripts/install-apt-packages.sh .github/apt/web-packages.txt

      - name: Set up Emscripten
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.6
          "$HOME/emsdk/emsdk" activate 6.0.6
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$HOME/emsdk/.emscripten" >> "$GITHUB_ENV"
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Set up locked Ziran
        uses: ./.github/actions/ziran

      - name: Build Web ZIP
        run: |
          set -euo pipefail
          make web
          test -f build/dist/uku-web.zip

      - name: Set up browser test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test browser persistence
        env:
          CHROMIUM: google-chrome
        run: node tests/web_test.mjs

  build-android-debug:
    name: Build Android Debug
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    env:
      APT_CACHE_DIR: /tmp/apt-cache
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Android apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: android-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt/android-packages.txt') }}
          restore-keys: |
            android-apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Android apt dependencies
        timeout-minutes: 15
        run: .github/scripts/install-apt-packages.sh .github/apt/android-packages.txt

      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/34.0.0
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-api36-bt34-ndk28-cmake322
          restore-keys: |
            android-sdk-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Android SDK Components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up locked Ziran
        uses: ./.github/actions/ziran

      - name: Build Android Debug APK
        run: sh scripts/android-build.sh -Puku.onlyAbi=arm64-v8a

name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APT_CACHE_DIR: /tmp/apt-cache
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Test apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: test-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt/test-packages.txt') }}
          restore-keys: |
            test-apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Test Dependencies
        timeout-minutes: 15
        run: .github/scripts/install-apt-packages.sh .github/apt/test-packages.txt

      - name: Run Tests
        run: make test

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    env:
      APT_CACHE_DIR: /tmp/apt-cache
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Web apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: web-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt/web-packages.txt') }}
          restore-keys: |
            web-apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Web Dependencies
        timeout-minutes: 15
        run: .github/scripts/install-apt-packages.sh .github/apt/web-packages.txt

      - name: Set up Emscripten
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$HOME/emsdk/.emscripten" >> "$GITHUB_ENV"
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Build Web ZIP
        run: |
          set -euo pipefail
          make web
          mkdir -p build/release/web
          cp build/dist/uku-web.zip build/release/web/

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: build/release/web/*
          if-no-files-found: error

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ${{ matrix.runner }}
    needs: test
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            tool_arch: x86_64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            tool_arch: aarch64
    env:
      APT_CACHE_DIR: /tmp/apt-cache
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Linux apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: linux-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt/linux-packages.txt') }}
          restore-keys: |
            linux-apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux Dependencies
        timeout-minutes: 15
        run: .github/scripts/install-apt-packages.sh .github/apt/linux-packages.txt

      - name: Install AppImage Tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fL -o "$HOME/.local/bin/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.tool_arch }}.AppImage
          curl -fL -o "$HOME/.local/bin/linuxdeploy-plugin-appimage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-${{ matrix.tool_arch }}.AppImage
          curl -fL -o "$HOME/.local/bin/appimagetool" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.tool_arch }}.AppImage
          chmod +x "$HOME/.local/bin/linuxdeploy" "$HOME/.local/bin/linuxdeploy-plugin-appimage" "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          RAY_RAYLIB_CONFIG: -DSUPPORT_SCREEN_CAPTURE=0 -DSUPPORT_COMPRESSION_API=0 -DSUPPORT_AUTOMATION_EVENTS=0 -DSUPPORT_CLIPBOARD_IMAGE=0 -DSUPPORT_FILEFORMAT_BMP=0 -DSUPPORT_FILEFORMAT_GIF=0 -DSUPPORT_FILEFORMAT_QOI=0 -DSUPPORT_FILEFORMAT_DDS=0 -DSUPPORT_FILEFORMAT_TTF=0
        run: |
          set -euo pipefail
          RAY_SDL_INCLUDE_DIR="$(pkg-config --variable=includedir sdl2 | sed 's,/SDL2$,,')"
          RAY_CFLAGS="$(pkg-config --cflags sdl2 libdrm gbm egl glesv2)"
          RAY_LDLIBS="$(pkg-config --libs sdl2 libdrm gbm egl glesv2)"
          RAY_SDL_LDLIBS="$(pkg-config --libs sdl2)"
          export RAY_SDL_INCLUDE_DIR RAY_CFLAGS RAY_LDLIBS RAY_SDL_LDLIBS
          make appimage
          mkdir -p build/release/linux
          find build/dist/linux -maxdepth 1 -type f -name '*.AppImage' -exec cp {} build/release/linux/ \;
          test -n "$(find build/release/linux -type f -name '*.AppImage' -print -quit)"

      - name: Smoke Test Linux AppImage
        timeout-minutes: 5
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          DISPLAY: ":99"
        run: |
          set -euo pipefail
          appimage="$(find build/release/linux -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          chmod +x "$appimage"
          Xvfb "$DISPLAY" -screen 0 800x600x24 >/tmp/uku-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$app_pid" "$xvfb_pid" >/dev/null 2>&1 || true' EXIT
          sleep 2
          "$appimage" >/tmp/uku-appimage.log 2>&1 &
          app_pid=$!
          for _ in $(seq 1 30); do
            if xwininfo -tree -root | grep -q 'Ukuvota'; then
              exit 0
            fi
            if ! kill -0 "$app_pid" >/dev/null 2>&1; then
              echo "AppImage exited before opening a window"
              cat /tmp/uku-appimage.log || true
              exit 1
            fi
            sleep 1
          done
          echo "AppImage did not open an X11 window within 30 seconds"
          cat /tmp/uku-appimage.log || true
          exit 1

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-appimage-${{ matrix.arch }}
          path: build/release/linux/*
          if-no-files-found: error

  build-linux-deb:
    name: Build Linux Deb
    runs-on: ${{ matrix.runner }}
    needs: test
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    env:
      APT_CACHE_DIR: /tmp/apt-cache
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Linux apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: linux-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt/linux-packages.txt') }}
          restore-keys: |
            linux-apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux Dependencies
        timeout-minutes: 15
        run: .github/scripts/install-apt-packages.sh .github/apt/linux-packages.txt

      - name: Build Debian Package
        run: |
          set -euo pipefail
          make deb
          mkdir -p build/release/linux
          find build/dist/deb -maxdepth 1 -type f -name '*.deb' -exec cp {} build/release/linux/ \;
          deb="$(find build/release/linux -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" >/dev/null

      - name: Upload Linux Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-deb-${{ matrix.arch }}
          path: build/release/linux/*
          if-no-files-found: error

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/34.0.0
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-api36-bt34-ndk28-cmake322
          restore-keys: |
            android-sdk-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Android SDK Components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Prepare Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is required to build Android release artifacts"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/uku-release.keystore

      - name: Build Android APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is required to build Android release artifacts"
            exit 1
          fi
          if [ -z "${KEY_ALIAS:-}" ]; then
            KEY_ALIAS=uku-key
          fi
          make android-release-ci PASSWORD="$KEYSTORE_PASSWORD" ANDROID_KEY_ALIAS="$KEY_ALIAS"

      - name: Collect Android Release Files
        run: |
          set -euo pipefail
          mkdir -p build/release/android
          VERSION="$(awk '/versionName "/ { gsub(/^.*versionName "/, ""); gsub(/".*$/, ""); print; exit }' droid/app/build.gradle)"
          test -n "$VERSION"
          for artifact in "build/android/uku-$VERSION.apk" "build/android/uku-$VERSION.aab"; do
            if [ ! -f "$artifact" ]; then
              echo "Missing Android release artifact: $artifact"
              exit 1
            fi
            cp "$artifact" build/release/android/
          done

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: build/release/android/*
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - build-web
      - build-linux-appimage
      - build-linux-deb
      - build-android
    timeout-minutes: 60
    outputs:
      tag_pushed: ${{ steps.tag_version.outputs.tag_pushed }}
      release_upload: ${{ steps.tag_version.outputs.release_upload }}
      tag_name: ${{ steps.tag_version.outputs.tag_name }}
      version: ${{ steps.tag_version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: build/release
          merge-multiple: true

      - name: Verify Release Artifacts
        run: |
          set -euo pipefail
          VERSION="$(awk '/versionName "/ { gsub(/^.*versionName "/, ""); gsub(/".*$/, ""); print; exit }' droid/app/build.gradle)"
          test -n "$VERSION"
          missing=0
          while IFS= read -r file; do
            if [ ! -f "build/release/$file" ]; then
              echo "::error::missing release artifact: $file"
              missing=1
            fi
          done < <(scripts/list-expected-release-assets.sh "$VERSION")
          exit "$missing"

      - name: Create and Push Tag If Version Is New
        id: tag_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(awk '/versionName "/ { gsub(/^.*versionName "/, ""); gsub(/".*$/, ""); print; exit }' droid/app/build.gradle)"
          test -n "$VERSION"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort -u > existing-release-assets.txt
              scripts/list-expected-release-assets.sh "$VERSION" | sort -u > expected-release-assets.txt
              comm -23 expected-release-assets.txt existing-release-assets.txt > missing-release-assets.txt
              if [ -s missing-release-assets.txt ]; then
                echo "release_upload=true" >> "$GITHUB_OUTPUT"
              else
                echo "release_upload=false" >> "$GITHUB_OUTPUT"
              fi
              echo "tag_pushed=false" >> "$GITHUB_OUTPUT"
            else
              echo "tag_pushed=true" >> "$GITHUB_OUTPUT"
              echo "release_upload=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $VERSION"
            git push origin "$TAG"
            echo "tag_pushed=true" >> "$GITHUB_OUTPUT"
            echo "release_upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.tag_version.outputs.release_upload == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.tag_name }}
          files: build/release/*
          overwrite_files: true
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-waozi-site:
    name: Notify Waozi devlog
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.release_upload == 'true'
    steps:
      - name: Trigger Waozi site rebuild
        env:
          WAOZI_SITE_DISPATCH_TOKEN: ${{ secrets.WAOZI_SITE_DISPATCH_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${WAOZI_SITE_DISPATCH_TOKEN:-}" ]; then
            echo "::warning::WAOZI_SITE_DISPATCH_TOKEN is not configured; skipping Waozi devlog dispatch"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WAOZI_SITE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/waozixyz/waozi/dispatches \
            -d "{\"event_type\":\"devlog\",\"client_payload\":{\"project\":\"uku\",\"version\":\"$VERSION\"}}"

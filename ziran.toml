[package]
tool = "kryon"
name = "uku"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "master"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "master"

[install]
bin = "uku"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"
library = "sqlite3"
# scripts/native_deps.sh builds this from the locked liboqs source.
static_archive = "build/liboqs/lib/liboqs.a"

[tool.kryon.profiles.web]
backend = "canvas"

[dependencies.sqlite]
git = "https://github.com/ziranlang/sqlite.git"
ref = "master"

[dependencies.daochi_client]
git = "https://github.com/ziranlang/daochi-client.git"
ref = "master"

[dependencies.kss]
git = "https://github.com/kryonlabs/kss.git"
ref = "master"

[tool.kryon.install]
profile = "desktop"
name = "Ukuvota"
comment = "Collective decisions with visible resistance"
categories = "Office;"

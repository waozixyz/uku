plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.waozi.uku'
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId 'xyz.waozi.uku'
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        def abis = project.findProperty('abi') ?: 'armeabi-v7a,arm64-v8a'
        ndk {
            abis.split(',').collect { it.trim() }.each { abiFilters it }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    dependenciesInfo {
        includeInApk = false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
